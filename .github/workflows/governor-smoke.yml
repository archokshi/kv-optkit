name: Governor Smoke

on:
  workflow_dispatch:

jobs:
  governor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start KV-OptKit server (SIM)
        env:
          KVOPT_ADAPTER: sim
          KVOPT_PORT: '9001'
        run: |
          nohup python -m kvopt.server.main > server.log 2>&1 &
          echo $! > server.pid
          sleep 5

      - name: Run governor stress (assert throttle > 0)
        run: |
          python scripts/governor_stress_offload.py --base http://localhost:9001 --iters 6 --interval 0.75 --target 0.55 --max-actions 3 --assert

      - name: Scrape metrics and print governor counters
        run: |
          curl -sSf http://localhost:9001/metrics | tee metrics.txt > /dev/null
          grep -E "^(kvopt_governor_throttle_events_total|kvopt_offload_governed_bytes_total|kvopt_offload_tick_cap_bytes)" metrics.txt || true

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi
