version: "3.9"

services:
  vllm:
    image: kvopt/vllm-gpu:dev
    container_name: vllm-gpu-baseline
    restart: unless-stopped
    environment:
      - MODEL=${MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    ports:
      - "8000:8000"

  kvopt:
    build:
      context: ../../..
      dockerfile: Dockerfile.demo
    working_dir: /app/kv-optkit
    container_name: kvopt-server-gpu-baseline
    restart: unless-stopped
    environment:
      - KVOPT_PORT=9001
      - KVOPT_ADAPTER=${KVOPT_ADAPTER:-vllm}
      - UPSTREAM_VLLM_URL=${UPSTREAM_VLLM_URL:-http://vllm:8000}
      - PROMETHEUS_URL=http://prometheus:9090
    ports:
      - "9001:9001"
    depends_on:
      - vllm
    command: ["bash", "-lc", "python -m kvopt.server.main"]

  prometheus:
    image: prom/prometheus:latest
    container_name: kvopt-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: kvopt-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ../../grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana-provisioning:/etc/grafana/provisioning

networks:
  default:
    name: kvopt-gpu-demo
